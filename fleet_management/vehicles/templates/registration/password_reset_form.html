<!DOCTYPE html>
<html>
<head>
    <title>Password Reset - Telnet Asset Management</title>
    <style>
        body { background:#f4f6f9; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { max-width:400px; margin:8% auto; background:#fff; padding:30px; border-radius:10px; box-shadow:0 12px 24px rgba(0,0,0,.12); }
        h2 { color:#1b2f5a; text-align:center; }
        input { width:100%; padding:10px 12px; border-radius:6px; border:1px solid #bcc9dc; margin-bottom:15px; }
        button { width:100%; background:#0033a0; color:#fff; padding:10px 12px; border:none; border-radius:7px; font-weight:700; cursor:pointer; }
        a { color:#1e73be; text-decoration:none; }
    </style>
</head>
<body>
<div class="card">
    <h2>Reset Your Password</h2>
    <p>Enter your username/email and we will send a reset link.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.email.label_tag }}<br>
        {{ form.email }}
        {{ form.email.errors }}
        <button type="submit">Send reset email</button>
    </form>
    <p style="margin-top:12px; text-align:center;"><a href="{% url 'login' %}">Back to login</a></p>
</div>
</body>
</html>
