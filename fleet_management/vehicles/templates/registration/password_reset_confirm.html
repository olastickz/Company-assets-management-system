<!DOCTYPE html>
<html>
<head>
    <title>Set New Password</title>
    <style>
        body { background:#f4f6f9; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { max-width:400px; margin:8% auto; background:#fff; padding:30px; border-radius:10px; box-shadow:0 12px 24px rgba(0,0,0,.12); }
        h2 { color:#1b2f5a; text-align:center; }
        input { width:100%; padding:10px 12px; border-radius:6px; border:1px solid #bcc9dc; margin-bottom:12px; }
        button { width:100%; background:#0033a0; color:#fff; padding:10px 12px; border:none; border-radius:7px; font-weight:700; cursor:pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>Choose a New Password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.new_password1.label_tag }}<br>
        {{ form.new_password1 }}
        {{ form.new_password1.errors }}

        {{ form.new_password2.label_tag }}<br>
        {{ form.new_password2 }}
        {{ form.new_password2.errors }}

        <button type="submit">Set password</button>
    </form>
</div>
</body>
</html>
