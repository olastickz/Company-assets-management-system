<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial; background:#f4f6f9; padding:30px; }
        h1 { text-align:center; }
        .container { max-width:600px; margin:auto; background:white; padding:20px; border-radius:10px; }
        .subtitle { color:#666; font-size:14px; }
        form { margin-top:20px; }
        input, select, textarea { width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:5px; }
        button { padding:10px 20px; background:#3498db; color:white; border:none; border-radius:5px; cursor:pointer; }
        a { text-decoration:none; color:#3498db; margin-left:10px; }
        .back-btn { display:inline-flex; align-items:center; gap:8px; padding:8px 16px; background:#6c757d; color:white; border-radius:4px; font-weight:600; margin-bottom:20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ back_url }}" class="back-btn">← Back</a>

        <h1>{{ title }}</h1>
        <p class="subtitle">Equipment: {{ equipment.name }}</p>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="back_url" value="{{ back_url }}" />
            {{ form.as_p }}
            <button type="submit">Save</button>
            <a href="{{ back_url }}">Cancel</a>
        </form>
    </div>
</body>
</html>
