services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: company_assets_db
      POSTGRES_USER: company_assets_db_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ./.env
    working_dir: /app/fleet_management
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      exec gunicorn asset_management.wsgi:application
      --bind 0.0.0.0:7038 --workers 3"
    ports:
      - "7038:7038"
    volumes:
      - ./media:/app/fleet_management/media
      - ./staticfiles:/app/fleet_management/staticfiles
    depends_on:
      - db
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ./.env
    working_dir: /app/fleet_management
    command: python manage.py run_email_scheduler
    volumes:
      - ./media:/app/fleet_management/media
    depends_on:
      - db
      - web
    restart: unless-stopped

volumes:
  postgres_data: