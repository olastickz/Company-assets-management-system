services:
  - type: web
    name: asset-management
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd fleet_management
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py ensure_default_admin
    startCommand: |
      cd fleet_management
      python manage.py ensure_default_admin
      gunicorn asset_management.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,207.180.246.69"
      - key: APP_ADMIN_USERNAME
        value: "telnet"
      - key: APP_ADMIN_PASSWORD
        value: "Olastickz2630"
      - key: DATABASE_URL
        sync: false
