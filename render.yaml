services:
  - type: web
    name: asset-management
    runtime: python
    plan: free
    buildCommand: |
      pip install -r root-requirements.txt
      cd fleet_management
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      cd fleet_management
      gunicorn asset_management.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: DATABASE_URL
        sync: false
